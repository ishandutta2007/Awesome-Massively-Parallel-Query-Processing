<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080c16"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/></linearGradient><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes streamFlow{0%{stroke-dashoffset:600}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.badge-text,.metric-sub,.metric-title,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.metric-title{font-weight:700;font-size:15px;fill:#f8fafc}.metric-sub{font-weight:400;font-size:12px;fill:#64748b}.animated-stream{stroke-dasharray:20,40;animation:streamFlow 12s linear infinite}.animated-stream-rev{stroke-dasharray:15,30;animation:streamFlow 16s linear infinite reverse}.pulse-orb{animation:pulseGlow 6s ease-in-out infinite alternate;transform-origin:center}.floating-card-1{animation:floatNode 5s ease-in-out infinite}.floating-card-2{animation:floatNode 6s ease-in-out 1s infinite}.floating-card-3{animation: